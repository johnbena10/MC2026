<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @media (prefers-color-scheme: light) {
      .background { fill: url(#gradient-light); }
      .text { fill: white; }
    }
    @media (prefers-color-scheme: dark) {
      .background { fill: url(#gradient-dark); }
      .text { fill: white; }
    }
  </style>
  <defs>
    <linearGradient id="gradient-light" x1="0" y1="0" x2="180" y2="180">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#EC4899"/>
    </linearGradient>
    <linearGradient id="gradient-dark" x1="0" y1="0" x2="180" y2="180">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#F472B6"/>
    </linearGradient>
  </defs>
  <rect class="background" width="180" height="180" rx="37" fill="url(#gradient-light)"/>
  <text class="text" x="90" y="115" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="72" font-weight="800" fill="white">MC</text>
</svg>
